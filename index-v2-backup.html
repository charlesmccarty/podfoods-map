<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright.Blue x Pod Foods · Partnership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #183EF6;
    --primary-deep: #0F2ACF;
    --ink: #0F172A;
    --ink-2: #334155;
    --muted: #64748B;
    --bg: #F8FAFC;
    --card: #FFFFFF;
    --border: #E2E8F0;
    --soft: rgba(24, 62, 246, 0.07);
    --chrome-h: 64px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
    --shadow: 0 12px 32px rgba(15, 23, 42, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; cursor: pointer; }
  img { display: block; }
  svg { display: block; }

  .slide-title {
    position: fixed;
    top: 48px;
    left: 0;
    right: 0;
    z-index: 20;
    text-align: center;
    font-size: clamp(2.4rem, 4.2vw, 3.4rem);
    font-weight: 800;
    letter-spacing: -0.035em;
    line-height: 1.1;
    color: var(--ink);
    white-space: nowrap;
    pointer-events: none;
    opacity: 0;
    translate: 0 -10px;
  }
  .slide-title.is-in {
    opacity: 1;
    translate: 0 0;
    transition: opacity 480ms var(--ease) 160ms, translate 480ms var(--ease) 160ms;
  }
  .slide-title.on-dark { color: #fff; }
  .slide-title:empty { display: none; }
  @media (prefers-reduced-motion: reduce) {
    .slide-title { opacity: 1 !important; translate: none !important; transition: none !important; }
  }

  .slide-bullets {
    position: fixed;
    left: 50%;
    bottom: calc(var(--chrome-h) + 28px);
    transform: translateX(-50%);
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 3rem;
    white-space: nowrap;
    pointer-events: none;
  }
  .slide-bullets:empty { display: none; }
  .slide-bullets .b {
    display: flex;
    align-items: center;
    gap: 0.65rem;
    font-size: 1.1rem;
    font-weight: 650;
    letter-spacing: -0.01em;
    color: var(--ink-2);
    opacity: 0;
    translate: 0 14px;
  }
  .slide-bullets .b.is-in {
    opacity: 1;
    translate: 0 0;
    transition: opacity 480ms var(--ease) var(--d, 0ms), translate 480ms var(--ease) var(--d, 0ms);
  }
  .slide-bullets .b::before {
    content: "";
    width: 9px;
    height: 9px;
    border-radius: 999px;
    background: var(--primary);
    flex: 0 0 auto;
  }
  .slide-bullets.on-dark .b { color: rgba(255, 255, 255, 0.92); }
  .slide-bullets.on-dark .b::before { background: #fff; }
  @media (prefers-reduced-motion: reduce) {
    .slide-bullets .b { opacity: 1 !important; translate: none !important; transition: none !important; }
  }

  .deck { position: fixed; inset: 0 0 var(--chrome-h) 0; overflow: hidden; }
  .track {
    display: flex;
    height: 100%;
    transition: transform 640ms var(--ease);
    will-change: transform;
  }
  .slide { position: relative; flex: 0 0 100%; height: 100%; }
  .slide-inner { position: relative; width: 100%; height: 100%; overflow: hidden; }
  .slide-scale {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(100% - 64px, 1180px);
    transform: translate(-50%, -50%);
    transform-origin: center center;
    will-change: transform;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2.5rem;
  }

  /* ---------- reveal motion ---------- */
  .reveal { opacity: 0; transform: translateY(18px) scale(0.98); }
  .js .slide.is-active .reveal.is-visible {
    opacity: 1;
    transform: none;
    transition: opacity 640ms var(--ease) var(--d, 0ms), transform 640ms var(--ease) var(--d, 0ms);
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
  }

  /* ---------- shared glyph chips ---------- */
  .glyph {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--card);
    border: 1.5px solid var(--border);
    border-radius: 1.5rem;
    box-shadow: var(--shadow);
  }
  .glyph svg { stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .glyph.on-primary { background: var(--primary); border-color: var(--primary); }
  .glyph.on-primary svg { stroke: #fff; }

  .num {
    font-weight: 800;
    letter-spacing: -0.04em;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- hero ---------- */
  .lockup {
    display: flex;
    align-items: center;
    gap: 1.6rem;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 800;
    letter-spacing: -0.04em;
  }
  .lockup .dot { color: var(--primary); }
  .lockup .x { color: var(--muted); font-weight: 300; font-size: 0.6em; }
  .lockup .pod { color: var(--primary-deep); }
  .hero-glyphs { display: flex; gap: 2.25rem; }
  .hero-glyphs .glyph { width: 108px; height: 108px; }
  .hero-glyphs svg { width: 52px; height: 52px; }
  .hero-rule { width: 72px; height: 4px; border-radius: 999px; background: var(--primary); }

  /* ---------- network rollout (who we are) ---------- */
  @keyframes wireflow { to { stroke-dashoffset: -14; } }
  .rollout { display: flex; flex-direction: column; align-items: center; gap: 2.25rem; width: min(880px, 100%); }
  .venue-row { display: flex; gap: 2rem; }
  .venue-row .glyph { width: 92px; height: 92px; }
  .venue-row svg { width: 44px; height: 44px; }
  .feed-wires { width: 100%; height: 54px; }
  .feed-wires path {
    stroke: var(--primary);
    stroke-width: 2;
    fill: none;
    stroke-dasharray: 6 8;
    opacity: 0.5;
    animation: wireflow 1.4s linear infinite;
  }
  .usmap { width: min(460px, 100%); }
  .usmap svg { width: 100%; height: auto; overflow: visible; }
  .usmap .region {
    fill: #DDE4EE;
    stroke: #fff;
    stroke-width: 0.8;
    opacity: 0;
    transition: opacity 420ms var(--ease);
  }
  .usmap .region.is-on { opacity: 1; }
  .usmap .region.ghost.is-on { opacity: 0.28; }
  .usmap .pin-inner {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    transform: scale(0);
  }
  .usmap .pin-inner.is-on {
    transform: scale(1);
    transition: transform 520ms cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .usmap .pin-body { fill: var(--primary); }
  .usmap .pin-hole { fill: #fff; }
  @media (prefers-reduced-motion: reduce) {
    .usmap .region, .usmap .pin-inner { opacity: 1 !important; transform: none !important; transition: none !important; }
    .usmap .region.ghost { opacity: 0.28 !important; }
  }

  /* ---------- photo collage ---------- */
  .collage {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(2, minmax(200px, 30vh));
    gap: 14px;
    width: 100%;
  }
  .collage figure {
    position: relative;
    overflow: hidden;
    border-radius: 1.25rem;
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateY(26px) scale(0.96);
  }
  .js .slide.is-active .collage figure.is-on {
    opacity: 1;
    transform: none;
    transition: opacity 720ms var(--ease), transform 720ms var(--ease);
  }
  .collage img { width: 100%; height: 100%; object-fit: cover; }
  .c1 { grid-column: 1 / 3; grid-row: 1 / 3; }
  .c2 { grid-column: 3 / 5; grid-row: 1; }
  .c3 { grid-column: 5 / 7; grid-row: 1; }
  .c4 { grid-column: 3 / 5; grid-row: 2; }
  .c5 { grid-column: 5 / 7; grid-row: 2; }

  /* ---------- build stack ---------- */
  .stackline { display: flex; align-items: center; gap: 2.25rem; }
  .stack-col { display: flex; flex-direction: column; gap: 1.1rem; }
  .stack-item {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 130px;
    height: 96px;
    border-radius: 1.25rem;
    background: var(--card);
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow);
    opacity: 0;
    transform: translateX(-36px);
  }
  .js .slide.is-active .stack-item.is-on {
    opacity: 1;
    transform: none;
    transition: opacity 560ms var(--ease), transform 560ms var(--ease);
  }
  .stack-item svg { width: 44px; height: 44px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .merge-arrows { display: flex; flex-direction: column; gap: 2.4rem; }
  .merge-arrows svg { width: 64px; height: 24px; stroke: var(--primary); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; opacity: 0.75; }
  .one-unit {
    position: relative;
    width: 250px;
    height: 320px;
    border-radius: 1.75rem;
    background: linear-gradient(160deg, var(--primary) 0%, var(--primary-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 26px 60px rgba(24, 62, 246, 0.4);
  }
  .one-unit svg { width: 130px; height: 130px; stroke: #fff; fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .one-unit::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.22) 50%, transparent 70%);
    background-size: 240% 100%;
    animation: sheen 3.2s var(--ease) infinite;
  }
  @keyframes sheen { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }

  /* ---------- endpoint orbit ---------- */
  .orbit-stage { position: relative; display: flex; align-items: center; justify-content: center; width: 100%; }
  .orbit-photo {
    width: 320px;
    height: 430px;
    border-radius: 1.75rem;
    overflow: hidden;
    box-shadow: 0 26px 60px rgba(15, 23, 42, 0.28);
    position: relative;
    z-index: 2;
  }
  .orbit-photo img { width: 100%; height: 100%; object-fit: cover; }
  .orbit-sat {
    position: absolute;
    width: 108px;
    height: 108px;
    border-radius: 1.4rem;
    z-index: 3;
  }
  .orbit-sat svg { width: 50px; height: 50px; }
  .sat-1 { top: 4%; left: 13%; }
  .sat-2 { top: 4%; right: 13%; }
  .sat-3 { bottom: 4%; left: 13%; }
  .sat-4 { bottom: 4%; right: 13%; }
  .orbit-wire {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
  }
  .orbit-wire line {
    stroke: var(--primary);
    stroke-width: 2;
    stroke-dasharray: 5 7;
    opacity: 0.45;
    animation: wireflow 1.4s linear infinite;
  }

  /* ---------- speed race ---------- */
  .race { display: flex; flex-direction: column; gap: 3rem; width: min(940px, 100%); }
  .race-row { display: flex; align-items: center; gap: 1.75rem; }
  .race-row .glyph { width: 88px; height: 88px; flex: 0 0 auto; }
  .race-row .glyph svg { width: 42px; height: 42px; }
  .race-track { position: relative; flex: 1; height: 54px; border-radius: 999px; background: #EEF2F7; overflow: hidden; }
  .race-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 999px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 1.1rem;
  }
  .race-fill.trad { background: #CBD5E1; }
  .race-fill.fast { background: linear-gradient(90deg, var(--primary), var(--primary-deep)); box-shadow: 0 10px 26px rgba(24,62,246,0.35); }
  .js .slide.is-active .race-fill.trad.is-on { width: 96%; transition: width 2000ms var(--ease); }
  .js .slide.is-active .race-fill.fast.is-on { width: 26%; transition: width 700ms var(--ease); }
  .race-fill svg { width: 30px; height: 30px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .race-fill.trad svg { stroke: var(--ink-2); }
  .race-count { display: flex; gap: 0.5rem; margin-left: 0.5rem; flex: 0 0 auto; }
  .race-count .pip {
    width: 18px; height: 24px; border-radius: 5px;
    background: #CBD5E1;
  }
  .race-count .pip.lit { background: var(--primary); }

  /* ---------- revenue meters ---------- */
  .earn { display: flex; align-items: center; gap: 3rem; width: min(1020px, 100%); }
  .earn-unit {
    position: relative;
    flex: 0 0 auto;
    width: 190px;
    height: 250px;
    border-radius: 1.6rem;
    background: linear-gradient(160deg, var(--primary) 0%, var(--primary-deep) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 22px 50px rgba(24, 62, 246, 0.38);
  }
  .earn-unit svg { width: 96px; height: 96px; stroke: #fff; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
  .earn-rows { display: flex; flex-direction: column; gap: 1.4rem; flex: 1; }
  .earn-row { display: flex; align-items: center; gap: 1.25rem; }
  .earn-row .glyph { width: 68px; height: 68px; border-radius: 1.1rem; flex: 0 0 auto; }
  .earn-row .glyph svg { width: 34px; height: 34px; }
  .earn-track { position: relative; flex: 1; height: 44px; border-radius: 999px; background: #EEF2F7; overflow: hidden; }
  .earn-fill {
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    border-radius: 999px;
    background: linear-gradient(90deg, var(--primary), var(--primary-deep));
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 0.55rem;
  }
  .js .slide.is-active .earn-fill.is-on { width: 100%; transition: width 1100ms var(--ease) var(--d, 0ms); }
  .earn-fill .dollar {
    width: 30px;
    height: 30px;
    border-radius: 999px;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .earn-fill .dollar svg { width: 17px; height: 17px; stroke: var(--primary); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .earn-plus {
    align-self: center;
    font-size: 2.6rem;
    font-weight: 300;
    color: var(--muted);
    flex: 0 0 auto;
  }

  /* ---------- partnership equation ---------- */
  .equation { display: flex; align-items: center; justify-content: center; gap: 2.75rem; width: 100%; }
  .eq-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    width: 250px;
    height: 280px;
    border-radius: 1.75rem;
    background: var(--card);
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow);
  }
  .eq-card.result {
    background: linear-gradient(160deg, var(--primary) 0%, var(--primary-deep) 100%);
    border: none;
    box-shadow: 0 24px 55px rgba(24, 62, 246, 0.38);
  }
  .eq-name {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    color: var(--ink);
  }
  .eq-name .dot { color: var(--primary); }
  .eq-card svg.eq-icon { width: 84px; height: 84px; stroke: var(--ink); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .brand-dots { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.65rem; }
  .brand-dots span {
    width: 24px; height: 24px; border-radius: 7px;
    background: #EEF2F7;
    border: 1.5px solid var(--border);
  }
  .brand-dots span:nth-child(3n) { background: var(--soft); border-color: rgba(24,62,246,0.35); }
  .eq-op {
    font-size: 3.4rem;
    font-weight: 300;
    color: var(--muted);
    flex: 0 0 auto;
  }
  .chart-up { width: 170px; height: 130px; }
  .eq-card.result .chart-up polyline { stroke: #fff; }
  .eq-card.result .chart-up circle { fill: #fff; }
  .chart-up polyline {
    fill: none;
    stroke: var(--primary);
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 420;
    stroke-dashoffset: 420;
  }
  .js .slide.is-active .chart-up.is-drawn polyline {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1400ms var(--ease) 300ms;
  }
  .chart-up circle { fill: var(--primary); }

  /* ---------- questions ---------- */
  .talk {
    display: flex;
    align-items: center;
    gap: 1.4rem;
  }
  .talk-bubble {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 120px;
    height: 92px;
    border-radius: 1.4rem;
    background: var(--card);
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow);
    position: relative;
    font-size: 1.55rem;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .talk-bubble::after {
    content: "";
    position: absolute;
    bottom: -10px;
    width: 20px;
    height: 20px;
    background: inherit;
    border-right: 1.5px solid var(--border);
    border-bottom: 1.5px solid var(--border);
    transform: rotate(45deg);
  }
  .talk-bubble.bb { color: var(--ink); }
  .talk-bubble.bb::after { left: 24px; }
  .talk-bubble.bb .dot { color: var(--primary); }
  .talk-bubble.pf {
    background: var(--primary);
    border-color: var(--primary);
    color: #fff;
    margin-top: 2.2rem;
  }
  .talk-bubble.pf::after { right: 24px; border-color: var(--primary); }
  .q-grid { display: flex; gap: 1.75rem; flex-wrap: wrap; justify-content: center; }
  .q-tile {
    position: relative;
    width: 168px;
    height: 190px;
    border-radius: 1.5rem;
    background: var(--card);
    border: 1.5px solid var(--border);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.2rem;
  }
  .q-tile svg { width: 56px; height: 56px; stroke: var(--ink); fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .q-mark {
    position: absolute;
    top: -14px;
    right: -14px;
    width: 42px;
    height: 42px;
    border-radius: 999px;
    background: var(--primary);
    color: #fff;
    font-size: 1.35rem;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 18px rgba(24,62,246,0.35);
  }

  /* ---------- close ---------- */
  #close .slide-inner {
    background: linear-gradient(165deg, var(--primary) 0%, var(--primary-deep) 60%, #0A1E9E 100%);
  }
  .close-lockup {
    display: flex;
    align-items: center;
    gap: 1.6rem;
    font-size: clamp(2.2rem, 5vw, 3.8rem);
    font-weight: 800;
    letter-spacing: -0.04em;
    color: #fff;
  }
  .close-lockup .x { opacity: 0.55; font-weight: 300; font-size: 0.6em; }
  .close-lockup .dot { color: #9DB1FF; }
  .close-rule { width: 72px; height: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.85); }
  .close-chart { width: 230px; height: 150px; }
  .close-chart polyline {
    fill: none;
    stroke: #fff;
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 420;
    stroke-dashoffset: 420;
  }
  .js .slide.is-active .close-chart.is-drawn polyline {
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1400ms var(--ease) 400ms;
  }
  .close-chart circle { fill: #fff; }

  /* ---------- chrome ---------- */
  .chrome {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: var(--chrome-h);
    background: #fff;
    border-top: 1px solid var(--border);
    z-index: 10;
  }
  .chrome-inner {
    max-width: 1180px;
    height: 100%;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }
  .nav-btn {
    width: 44px;
    height: 44px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 160ms, background 160ms;
  }
  .nav-btn:hover:not(:disabled) { border-color: var(--primary); background: var(--soft); }
  .nav-btn:disabled { opacity: 0.35; cursor: default; }
  .nav-btn svg { width: 20px; height: 20px; stroke: var(--ink); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .progress { display: flex; gap: 8px; align-items: center; }
  .progress-dot {
    width: 8px; height: 8px;
    border-radius: 999px;
    border: none;
    background: #CBD5E1;
    padding: 0;
    transition: transform 200ms var(--ease), background 200ms;
  }
  .progress-dot.seen { background: #94A3B8; }
  .progress-dot.active { background: var(--primary); transform: scale(1.5); }
</style>
</head>
<body>

  <div class="slide-title" id="slideTitle" aria-live="polite"></div>
  <div class="slide-bullets" id="slideBullets" aria-live="polite"></div>

  <div class="deck">

                <div class="earn-track"><div class="earn-fill" data-earn style="--d:180ms"><span class="dollar"><svg viewBox="0 0 24 24"><path d="M12 3.5v17M16.5 6.5H10a2.75 2.75 0 0 0 0 5.5h4a2.75 2.75 0 0 1 0 5.5H7"/></svg></span></div></div>

                <div class="earn-track"><div class="earn-fill" data-earn style="--d:540ms"><span class="dollar"><svg viewBox="0 0 24 24"><path d="M12 3.5v17M16.5 6.5H10a2.75 2.75 0 0 0 0 5.5h4a2.75 2.75 0 0 1 0 5.5H7"/></svg></span></div></div>

      <section id="channel" data-title="The partnership" data-bullets="Pod brings brands + logistics|Bright.Blue runs the platform|Shared upside on every unit" class="slide" aria-label="Pod plus Bright.Blue equals growth">

              <div class="brand-dots" aria-hidden="true">
                <span></span><span></span><span></span><span></span>

                <span></span><span></span><span></span><span></span>
              </div>
              <div class="eq-name">Pod Foods</div>
            </div>
            <span class="eq-op reveal" aria-hidden="true">+</span>
            <div class="eq-card reveal" title="Bright.Blue: the platform">
              <svg class="eq-icon" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><rect x="8.5" y="5" width="7" height="6" rx="1"/><path d="M9 14h6M9 17h4"/></svg>

              <svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>

            <span class="x">×</span>
            <span>Pod Foods</span>
          </div>
          <div class="close-rule reveal" aria-hidden="true"></div>
          <svg class="close-chart reveal" data-path viewBox="0 0 170 130" aria-label="Growth together">

  <div class="chrome" role="navigation" aria-label="Slide controls">
    <div class="chrome-inner">
      <button type="button" class="nav-btn" id="prevBtn" aria-label="Previous slide">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <button type="button" class="nav-btn" id="nextBtn" aria-label="Next slide">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>
  </div>

  <script>
    (function () {
      var root = document.documentElement;
      root.classList.add("js");
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      var slides = Array.prototype.slice.call(document.querySelectorAll(".slide"));
      var track = document.getElementById("deckTrack");
      var prevBtn = document.getElementById("prevBtn");
      var nextBtn = document.getElementById("nextBtn");
      var progress = document.getElementById("progress");
      var total = slides.length;
      var index = 0;
      var indexById = {};

      slides.forEach(function (slide, i) {
        indexById[slide.id] = i;
        var dot = document.createElement("button");
        dot.type = "button";
        dot.className = "progress-dot";
        dot.setAttribute("aria-label", "Go to slide " + (i + 1));
        dot.addEventListener("click", function () { goTo(i); });
        progress.appendChild(dot);
      });

      var dots = Array.prototype.slice.call(progress.querySelectorAll(".progress-dot"));

      var usMap = document.getElementById("usMap");
      if (usMap) {
        var ukSvg = document.getElementById("ukSvg");
        var ukLand = document.getElementById("ukLand");
        var ukPins = document.getElementById("ukPins");
        var bbox = ukLand.getBBox();
        var pad = bbox.width * 0.03;
        ukSvg.setAttribute("viewBox",
          (bbox.x - pad) + " " + (bbox.y - pad) + " " + (bbox.width + pad * 2) + " " + (bbox.height + pad * 2));

        // Mercator calibration shipped with the amCharts UK map.
        var LON_L = -10.476971, LON_R = 1.765388, LAT_T = 60.846439, LAT_B = 49.1624;
        function mercY(lat) { return Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2)); }
        var mTop = mercY(LAT_T), mBot = mercY(LAT_B);
        function project(lon, lat) {
          return {
            x: bbox.x + ((lon - LON_L) / (LON_R - LON_L)) * bbox.width,
            y: bbox.y + ((mTop - mercY(lat)) / (mTop - mBot)) * bbox.height
          };
        }

        // Glasgow, Edinburgh, Newcastle, Manchester, Birmingham, Bristol, London
        var cities = [
          [-4.2518, 55.8642], [-3.1883, 55.9533], [-1.6178, 54.9783],
          [-2.2426, 53.4808], [-1.8904, 52.4862], [-2.5879, 51.4545], [-0.1276, 51.5072]
        ];
        var pinScale = bbox.height / 560;
        var svgNS = "http://www.w3.org/2000/svg";
        cities.forEach(function (c) {
          var pt = project(c[0], c[1]);
          var pos = document.createElementNS(svgNS, "g");
          pos.setAttribute("transform", "translate(" + pt.x + "," + pt.y + ") scale(" + pinScale + ")");
          var inner = document.createElementNS(svgNS, "g");
          inner.setAttribute("class", "pin-inner");
          var body = document.createElementNS(svgNS, "path");
          body.setAttribute("class", "pin-body");
          body.setAttribute("d", "M0 0C-4 -10 -15 -14 -15 -26a15 15 0 1 1 30 0C15 -14 4 -10 0 0z");
          var hole = document.createElementNS(svgNS, "circle");
          hole.setAttribute("class", "pin-hole");
          hole.setAttribute("cx", "0"); hole.setAttribute("cy", "-26"); hole.setAttribute("r", "6");
          inner.appendChild(body); inner.appendChild(hole);
          pos.appendChild(inner);
          ukPins.appendChild(pos);
        });
      }

      function lightVenueGrid() {
        if (!usMap) return;
        Array.prototype.forEach.call(usMap.querySelectorAll(".region"), function (d, i) {
          if (reduced) { d.classList.add("is-on"); return; }
          setTimeout(function () { d.classList.add("is-on"); }, 150 + i * 60);
        });
        Array.prototype.forEach.call(usMap.querySelectorAll(".pin-inner"), function (p, i) {
          if (reduced) { p.classList.add("is-on"); return; }
          setTimeout(function () { p.classList.add("is-on"); }, 1200 + i * 240);
        });
      }

      function resetVenueGrid() {
        if (!usMap) return;
        Array.prototype.forEach.call(usMap.querySelectorAll(".region, .pin-inner"), function (c) {
          c.classList.remove("is-on");
        });
      }

      // Space reserved for the fixed slide title and bottom bullet strip.
      var TITLE_H = 130;
      var BULLETS_H = 84;

      function fitSlide(slide) {
        var scaleEl = slide.querySelector(".slide-scale");
        var inner = slide.querySelector(".slide-inner");
        if (!scaleEl || !inner) return;
        var titled = slide.hasAttribute("data-title");
        var hasBullets = slide.hasAttribute("data-bullets");
        var topPad = titled ? TITLE_H : 0;
        var bottomPad = hasBullets ? BULLETS_H : 0;
        scaleEl.style.top = "calc(50% + " + ((topPad - bottomPad) / 2) + "px)";
        scaleEl.style.transform = "translate(-50%, -50%)";
        var availableH = Math.max(0, inner.clientHeight - 48 - topPad - bottomPad);
        var availableW = Math.max(0, inner.clientWidth - 48);
        var neededH = scaleEl.scrollHeight;
        var neededW = scaleEl.scrollWidth;
        var scaleH = neededH > 0 ? availableH / neededH : 1;
        var scaleW = neededW > 0 ? availableW / neededW : 1;
        var scale = Math.min(1, scaleH, scaleW);
        scale = Math.max(0.4, scale);
        scaleEl.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
      }

      function fitAll() { slides.forEach(fitSlide); }

      function resetSlideMotion(slide) {
        Array.prototype.forEach.call(slide.querySelectorAll(".reveal"), function (el) {
          el.classList.remove("is-visible");
          el.style.removeProperty("--d");
        });
        Array.prototype.forEach.call(slide.querySelectorAll("[data-layer], [data-collage], [data-race], [data-earn]"), function (el) {
          el.classList.remove("is-on");
        });
        Array.prototype.forEach.call(slide.querySelectorAll("[data-path]"), function (el) {
          el.classList.remove("is-drawn");
        });
        if (slide.id === "network") resetVenueGrid();
      }

      function activateSlide(slide) {
        Array.prototype.forEach.call(slide.querySelectorAll(".reveal"), function (el, i) {
          el.style.setProperty("--d", (reduced ? 0 : i * 90) + "ms");
          el.classList.add("is-visible");
        });
        Array.prototype.forEach.call(slide.querySelectorAll("[data-layer]"), function (el, i) {
          if (reduced) { el.classList.add("is-on"); return; }
          setTimeout(function () { el.classList.add("is-on"); }, 120 + i * 130);
        });
        Array.prototype.forEach.call(slide.querySelectorAll("[data-collage]"), function (el, i) {
          if (reduced) { el.classList.add("is-on"); return; }
          setTimeout(function () { el.classList.add("is-on"); }, 80 + i * 110);
        });
        Array.prototype.forEach.call(slide.querySelectorAll("[data-race]"), function (el) {
          if (reduced) { el.classList.add("is-on"); return; }
          setTimeout(function () { el.classList.add("is-on"); }, 350);
        });
        Array.prototype.forEach.call(slide.querySelectorAll("[data-earn]"), function (el) {
          if (reduced) { el.classList.add("is-on"); return; }
          setTimeout(function () { el.classList.add("is-on"); }, 400);
        });
        if (slide.id === "network") lightVenueGrid();
        Array.prototype.forEach.call(slide.querySelectorAll("[data-path]"), function (el) {
          if (reduced) el.classList.add("is-drawn");
          else setTimeout(function () { el.classList.add("is-drawn"); }, 300);
        });
        requestAnimationFrame(function () { fitSlide(slide); });
        setTimeout(function () { fitSlide(slide); }, reduced ? 0 : 520);
      }

      var deckEl = document.querySelector(".deck");
      // Native hash navigation scrolls the overflow-hidden deck (even after
      // load); force it back so positioning is driven solely by the transform.
      deckEl.addEventListener("scroll", function () {
        if (deckEl.scrollLeft !== 0) deckEl.scrollLeft = 0;
        if (deckEl.scrollTop !== 0) deckEl.scrollTop = 0;
      });

      var titleEl = document.getElementById("slideTitle");
      var bulletsEl = document.getElementById("slideBullets");

      function goTo(i, opts) {
        opts = opts || {};
        if (i < 0 || i >= total) return;
        index = i;
        deckEl.scrollLeft = 0;
        track.style.transform = "translate3d(" + (-index * 100) + "%, 0, 0)";

        if (titleEl) {
          titleEl.classList.remove("is-in");
          titleEl.textContent = slides[index].getAttribute("data-title") || "";
          titleEl.classList.toggle("on-dark", slides[index].hasAttribute("data-dark"));
          requestAnimationFrame(function () {
            requestAnimationFrame(function () { titleEl.classList.add("is-in"); });
          });
        }

        if (bulletsEl) {
          bulletsEl.innerHTML = "";
          bulletsEl.classList.toggle("on-dark", slides[index].hasAttribute("data-dark"));
          var raw = slides[index].getAttribute("data-bullets") || "";
          if (raw) {
            raw.split("|").slice(0, 3).forEach(function (text, bi) {
              var b = document.createElement("span");
              b.className = "b";
              b.style.setProperty("--d", (reduced ? 0 : 350 + bi * 160) + "ms");
              b.textContent = text;
              bulletsEl.appendChild(b);
            });
            requestAnimationFrame(function () {
              requestAnimationFrame(function () {
                Array.prototype.forEach.call(bulletsEl.children, function (b) { b.classList.add("is-in"); });
              });
            });
          }
        }

        slides.forEach(function (slide, si) {
          var active = si === index;
          slide.classList.toggle("is-active", active);
          slide.setAttribute("aria-hidden", active ? "false" : "true");
          if (active) activateSlide(slide);
          else resetSlideMotion(slide);
        });

        dots.forEach(function (d, di) {
          d.classList.toggle("active", di === index);
          d.classList.toggle("seen", di < index);
        });

        prevBtn.disabled = index === 0;
        nextBtn.disabled = index === total - 1;

        if (!opts.skipHash && history.replaceState) {
          history.replaceState(null, "", "#" + slides[index].id);
        }
      }

      function next() { goTo(index + 1); }
      function prev() { goTo(index - 1); }

      prevBtn.addEventListener("click", prev);
      nextBtn.addEventListener("click", next);

      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
        else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); prev(); }
        else if (e.key === "Home") { e.preventDefault(); goTo(0); }
        else if (e.key === "End") { e.preventDefault(); goTo(total - 1); }
      });

      var wheelLock = false;
      document.querySelector(".deck").addEventListener("wheel", function (e) {
        e.preventDefault();
        if (wheelLock) return;
        if (Math.abs(e.deltaY) < 12 && Math.abs(e.deltaX) < 12) return;
        wheelLock = true;
        var forward = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX > 0 : e.deltaY > 0;
        if (forward) next(); else prev();
        setTimeout(function () { wheelLock = false; }, 500);
      }, { passive: false });

      var touchX = null;
      document.querySelector(".deck").addEventListener("touchstart", function (e) {
        touchX = e.changedTouches[0].clientX;
      }, { passive: true });
      document.querySelector(".deck").addEventListener("touchend", function (e) {
        if (touchX == null) return;
        var dx = e.changedTouches[0].clientX - touchX;
        touchX = null;
        if (Math.abs(dx) < 50) return;
        if (dx < 0) next(); else prev();
      }, { passive: true });

      window.addEventListener("resize", fitAll);

      Array.prototype.forEach.call(document.querySelectorAll("img"), function (img) {
        if (img.complete) return;
        img.addEventListener("load", fitAll, { once: true });
      });

      var startId = (location.hash || "").replace("#", "");
      var start = indexById[startId] != null ? indexById[startId] : 0;
      goTo(start, { skipHash: !startId });
      fitAll();
    })();
  </script>
